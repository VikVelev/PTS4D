[package]
name = "pts4d"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pts4d"
path = "src/lib.rs"
# staticlib / cdylib so it can be linked from C (see src/ffi.rs and include/pts4d.h)
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "pts4d"
path = "src/main.rs"
required-features = ["viewer"]

[features]
default = ["viewer"]
# The standalone SDL viewer. To build just the library for embedding:
# cargo build --release --lib --no-default-features
viewer = ["dep:sdl2"]

[dependencies]
cgmath = { version = "0.18.0", features = ["swizzle"] }
rand = "0.8.5"
rayon = "1.8.1"
sdl2 = { version = "0.36.0", optional = true }
wavefront_obj = "10.0.0"

[profile.release]
debug = true

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Ctarget-cpu=native","--release"]